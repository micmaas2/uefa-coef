name: Update stand.json

# GitHub's cron is onbetrouwbaar (uren vertraging, runs overgeslagen). Daarom draait
# er één job die zelf beslist: pollen (elke 2 min) zolang er vandaag iets live/gepland
# is, anders slapen tot 10 min voor de eerstvolgende aftrap. Tegen het 6-uurs
# joblimiet start hij zichzelf opnieuw (chain). De crons zijn alleen een vangnet.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = één keer, watch = pollen/slapen en zichzelf doorstarten"
        default: watch
        type: choice
        options: [once, watch]
  schedule:
    - cron: "0 */6 * * *"       # vangnet: elke 6 uur een (her)start als de keten dood is

permissions:
  contents: write
  actions: write

concurrency:
  group: update-stand
  cancel-in-progress: true      # nieuwe start vervangt de lopende (slapende) job

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll / sleep / notify / commit
        id: loop
        run: |
          git config user.name "uefa-coef bot"
          git config user.email "actions@users.noreply.github.com"
          MODE="${{ github.event.inputs.mode }}"; [ -z "$MODE" ] && MODE=watch
          DEADLINE=$(( $(date +%s) + 320*60 ))
          echo "mode=$MODE"
          while true; do
            NOW=$(date +%s)
            if [ $(( NOW + 180 )) -gt $DEADLINE ]; then
              echo "time's up → chain"; echo "chain=yes" >> "$GITHUB_OUTPUT"; break
            fi
            timeout 60 git pull -q --rebase origin main || { git rebase --abort 2>/dev/null; git reset -q --hard origin/main; }
            cp stand.json /tmp/stand_before.json
            timeout 120 python3 -m uefa_coef.fetch || echo "fetch failed/timeout"
            timeout 60 python3 -m uefa_coef.engine || echo "engine failed"
            timeout 60 python3 -m uefa_coef.notify /tmp/stand_before.json stand.json || true
            if ! git diff --quiet -- data/matches.json data/unmapped.json; then
              git add data/matches.json data/unmapped.json stand.json
              git commit -q -m "auto: update stand $(date -u +'%Y-%m-%d %H:%M')" || true
              timeout 60 git push -q || { timeout 60 git pull -q --rebase origin main && timeout 60 git push -q; } || echo "push failed"
            fi
            [ "$MODE" = once ] && { echo "chain=no" >> "$GITHUB_OUTPUT"; break; }
            PLAN=$(timeout 30 python3 -m uefa_coef.plan 2>/dev/null || echo "poll 0")
            ACTION=${PLAN%% *}; SECS=${PLAN##* }
            [ "$ACTION" = poll ] && SECS=120
            case "$SECS" in ''|*[!0-9]*) SECS=120;; esac
            NOW=$(date +%s)
            if [ $(( NOW + SECS )) -gt $DEADLINE ]; then
              echo "time's up → chain"; echo "chain=yes" >> "$GITHUB_OUTPUT"; break
            fi
            echo "$(date -u +%H:%M) $ACTION ${SECS}s"
            sleep "$SECS"
          done
      - name: Chain next run
        if: steps.loop.outputs.chain == 'yes'
        run: gh workflow run update.yml --ref main -f mode=watch
