name: Update stand.json

# GitHub's cron is onbetrouwbaar voor hoge frequenties (*/5 wordt vaak overgeslagen).
# Daarom: één job per speelavond die zelf elke 2 min polt (max ~5,5 uur), plus een
# dagelijkse korte run voor nagekomen uitslagen en het programma.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = één keer, watch = blijven pollen tot alles afgelopen is"
        default: watch
        type: choice
        options: [once, watch]
  schedule:
    - cron: "15 16 * * 2,3,4"   # di/wo/do 18:15 NL-tijd: start de wake-lus (eerste aftrap 18:45)
    - cron: "30 9 * * *"        # dagelijks: nagekomen uitslagen + programma 3 dagen vooruit

permissions:
  contents: write

concurrency:
  group: update-stand
  cancel-in-progress: true      # een nieuwe (handmatige) start vervangt de lopende lus

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 345        # < 6 uur jobmaximum
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Poll, rebuild, notify, commit
        run: |
          git config user.name "uefa-coef bot"
          git config user.email "actions@users.noreply.github.com"
          MODE="${{ github.event.inputs.mode }}"
          [ -z "$MODE" ] && { [ "${{ github.event.schedule }}" = "30 9 * * *" ] && MODE=once || MODE=watch; }
          echo "mode=$MODE"
          DEADLINE=$(( $(date +%s) + 340*60 ))
          while true; do
            cp stand.json /tmp/stand_before.json
            python3 -m uefa_coef.fetch
            python3 -m uefa_coef.engine
            python3 -m uefa_coef.notify /tmp/stand_before.json stand.json || true
            if ! git diff --quiet -- data/matches.json data/unmapped.json; then
              git add data/matches.json data/unmapped.json stand.json
              git commit -q -m "auto: update stand $(date -u +'%Y-%m-%d %H:%M')"
              git pull -q --rebase origin main || true
              git push -q || true
            fi
            [ "$MODE" = once ] && break
            # stoppen als er vandaag niets meer live of gepland is
            python3 -m uefa_coef.pending && break
            [ $(date +%s) -gt $DEADLINE ] && break
            sleep 120
          done
          echo "done"
