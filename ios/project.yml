# XcodeGen spec — run `xcodegen` in this folder to produce UefaCoef.xcodeproj
name: UefaCoef
options:
  bundleIdPrefix: nl.michelmaas
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_TEAM: ""          # vul je Team ID in, of kies in Xcode: Signing & Capabilities
    CODE_SIGN_STYLE: Automatic
targets:
  UefaCoef:
    type: application
    platform: iOS
    sources: [UefaCoef, Shared]
    dependencies:
      - target: UefaCoefWidget
        embed: true
    info:
      path: UefaCoef/Info.plist
      properties:
        CFBundleDisplayName: UEFA Coef
        UILaunchScreen: {}
        NSSupportsLiveActivities: true
        UIBackgroundModes: [fetch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelmaas.uefacoef
  UefaCoefWidget:
    type: app-extension
    platform: iOS
    sources: [UefaCoefWidget, Shared]
    info:
      path: UefaCoefWidget/Info.plist
      properties:
        CFBundleDisplayName: UEFA Coef
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: nl.michelmaas.uefacoef.widget
